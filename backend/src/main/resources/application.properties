server.port=8080
spring.application.name=smart-teacher

# XAMPP MariaDB (the MySQL button in XAMPP). This PC uses port 3307.
spring.datasource.url=jdbc:mariadb://localhost:3307/alice_teacher?createDatabaseIfNotExist=true&serverTimezone=Africa/Kigali
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kigali
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Kigali

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.connection-timeout=180000

app.jwt.secret=SmartTeacherAliceProjectSecretKeyChangeMe2026!!
app.jwt.days=7
app.upload-dir=uploads
app.school-start=08:00
app.late-after=08:15
app.face-threshold=1.00
app.mysql-bin=C:/xampp7/mysql/bin
app.db-name=alice_teacher
app.db-port=3307
app.db-user=root
app.db-password=

# Set GEMINI_API_KEY in the environment, or put one line in backend/gemini-key.local (that file is not in git).
gemini.api-key=${GEMINI_API_KEY:}
gemini.models=gemini-2.5-flash-lite,gemini-2.5-flash,gemini-flash-latest

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
